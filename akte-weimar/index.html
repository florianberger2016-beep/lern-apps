<style>
/* fb-education Lern-Apps – Core Styles
   Ruhiges Grundlayout, verspielte Akzente nur in den Aufgaben.
   Keine externen Schriften oder Ressourcen (Datenschutz, kleine Dateien). */

:root {
  --bg: #12141c;
  --bg-2: #181b26;
  --card: #1f2331;
  --card-2: #272c3d;
  --line: #343a4f;
  --text: #eef0f6;
  --muted: #a3a9bd;
  --accent: #f39c3d;      /* Kürbis-Orange */
  --accent-2: #9d8cff;    /* Geister-Violett */
  --ok: #4cc38a;
  --warn: #f5c84b;
  --bad: #ef6b6b;
  --radius: 16px;
  --radius-s: 10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1:focus, h2:focus { outline: none; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: radial-gradient(1200px 600px at 50% -200px, #23263a 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--text);
  font-size: 18px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

.skip { position: absolute; left: -999px; }
.skip:focus { left: 12px; top: 12px; background: var(--accent); color: #000; padding: 8px 12px; border-radius: 8px; z-index: 99; }

/* ---------- Layout ---------- */
.app { max-width: 920px; margin: 0 auto; padding: 16px 16px 48px; }

.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; margin-bottom: 18px;
  background: rgba(31,35,49,.75); border: 1px solid var(--line);
  border-radius: var(--radius); position: sticky; top: 8px; z-index: 10;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.topbar .title { font-weight: 700; letter-spacing: .02em; margin-right: auto; font-size: 16px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 12px; font-size: 15px; white-space: nowrap;
}
.pill b { font-variant-numeric: tabular-nums; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px; margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.card.soft { background: var(--bg-2); box-shadow: none; }

h1, h2, h3 { line-height: 1.2; margin: 0 0 12px; }
h1 { font-size: clamp(28px, 5vw, 42px); letter-spacing: .01em; }
h2 { font-size: clamp(22px, 3.6vw, 28px); }
h3 { font-size: 19px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.center { text-align: center; }
.kicker { text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
.big-emoji { font-size: 56px; line-height: 1; margin-bottom: 8px; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--card-2); color: var(--text);
  font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 12px; cursor: pointer;
  min-height: 48px; transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:hover { border-color: var(--accent-2); }
.btn:active { transform: scale(.98); }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: #1b1206; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }

/* ---------- Speech bubble (Guide-Figur) ---------- */
.guide { display: flex; gap: 14px; align-items: flex-start; margin: 14px 0; }
.guide .avatar { font-size: 40px; line-height: 1; flex: 0 0 auto; filter: drop-shadow(0 4px 10px rgba(157,140,255,.35)); }
.bubble {
  position: relative; background: var(--card-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 16px; flex: 1;
}
.bubble::before {
  content: ""; position: absolute; left: -8px; top: 16px; width: 14px; height: 14px;
  background: var(--card-2); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
  transform: rotate(45deg);
}
.bubble .who { font-size: 13px; font-weight: 700; color: var(--accent-2); margin-bottom: 2px; }

/* ---------- Reading texts ---------- */
.paper {
  background: #f4ecd8; color: #2b2418; border-radius: 6px; padding: 20px 22px;
  font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.6;
  box-shadow: 0 6px 18px rgba(0,0,0,.4); transform: rotate(-.4deg); margin: 8px 0 18px;
}
.paper p { margin: 0 0 10px; }
.paper .sign { text-align: right; font-style: italic; }
.paper.diary { background: #e9e2f5; transform: rotate(.3deg); }

/* ---------- Tasks ---------- */
.task { border-top: 1px dashed var(--line); padding-top: 16px; margin-top: 16px; }
.task:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.task .q { font-weight: 600; margin-bottom: 10px; }
.task .num { display: inline-block; min-width: 28px; color: var(--accent); font-weight: 800; }
.task.done .q::after { content: " ✅"; }

.opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.opt {
  appearance: none; font: inherit; color: var(--text); text-align: left;
  background: var(--bg-2); border: 2px solid var(--line); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; min-height: 52px; transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--accent-2); }
.opt.right { border-color: var(--ok); background: rgba(76,195,138,.14); }
.opt.wrong { border-color: var(--bad); background: rgba(239,107,107,.12); animation: shake .35s; }
.opt[disabled] { cursor: default; }

.gap-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 19px; }
.gap-input {
  font: inherit; color: var(--text); background: var(--bg-2); border: 2px solid var(--line);
  border-radius: 10px; padding: 8px 12px; width: 190px; max-width: 100%;
}
.gap-input.right { border-color: var(--ok); }
.gap-input.wrong { border-color: var(--bad); animation: shake .35s; }
.hint-verb { color: var(--muted); font-style: italic; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
.chip {
  appearance: none; font: inherit; color: var(--text); cursor: pointer;
  background: var(--card-2); border: 2px solid var(--line); border-radius: 10px; padding: 8px 14px; min-height: 46px;
}
.chip:hover { border-color: var(--accent-2); }
.chip.used { visibility: hidden; }
.answer-zone {
  border: 2px dashed var(--line); border-radius: 12px; padding: 8px; margin-bottom: 10px;
  min-height: 62px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.answer-zone.right { border-color: var(--ok); border-style: solid; }
.answer-zone.wrong { border-color: var(--bad); animation: shake .35s; }
.answer-zone:empty::before { content: attr(data-placeholder); color: var(--muted); font-size: 15px; padding-left: 6px; }

.feedback { margin-top: 10px; border-radius: 10px; padding: 10px 14px; font-size: 16px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: rgba(76,195,138,.14); border: 1px solid rgba(76,195,138,.5); }
.feedback.tip { background: rgba(245,200,75,.12); border: 1px solid rgba(245,200,75,.45); }
.feedback.bad { background: rgba(239,107,107,.12); border: 1px solid rgba(239,107,107,.45); }

/* ---------- Code lock ---------- */
.lock { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
.lock input {
  width: 64px; height: 76px; text-align: center; font: 700 34px var(--mono);
  color: var(--accent); background: #0d0f15; border: 2px solid var(--line); border-radius: 12px;
}
.lock.ok input { border-color: var(--ok); color: var(--ok); }

/* ---------- Toast & confetti ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
  background: var(--card-2); border: 1px solid var(--accent); color: var(--text);
  padding: 12px 18px; border-radius: 14px; box-shadow: var(--shadow); z-index: 50;
  transition: transform .3s ease; max-width: 92vw; text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.progress { height: 8px; background: var(--bg-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .4s ease; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pop { animation: pop .45s ease both; }
.float { animation: float 3s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(5,6,10,.7); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal-back.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; max-width: 520px; width: 100%; box-shadow: var(--shadow); }

.footer-note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 28px; }

@media (max-width: 560px) {
  body { font-size: 17px; }
  .card { padding: 16px; }
  .lock input { width: 54px; height: 66px; font-size: 28px; }
}


/* =========================================================
   Akte Weimar – Archiv-Design
   Schreibtisch (Linoleum) · Aktendeckel · Schreibmaschine · Stempel · Karteikarten
   Alles reines CSS, keine Bilder, keine externen Schriften.
   ========================================================= */
:root {
  --desk: #27322b; --desk-2: #1d2520;
  --manila: #cdb487; --manila-dk: #a98e5c; --manila-lt: #dcc79e;
  --paper: #f3ecd9; --paper-2: #ebe1c8; --rule: #d6c9aa;
  --ink: #1f2430; --ink-soft: #4a4a48;
  --stamp: #4d3a8a; --red: #b0262c; --green: #2f6b3a;
  --type: "American Typewriter", "Courier Prime", "Courier New", Courier, monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --hand: "Bradley Hand", "Segoe Print", "Ink Free", "Comic Sans MS", cursive;
  /* Core-Variablen auf Papier umstellen */
  --bg: var(--desk); --card: var(--paper); --card-2: var(--paper-2); --line: var(--rule);
  --text: var(--ink); --muted: var(--ink-soft); --accent: var(--stamp); --accent-2: var(--stamp);
  --ok: var(--green); --bad: var(--red); --warn: #9a6a12; --font: var(--serif);
}
body {
  font-family: var(--serif); font-size: 18px; color: var(--ink);
  background:
    radial-gradient(1200px 700px at 50% 0%, rgba(255,255,255,.06), transparent 70%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.035) 0 2px, transparent 2px 6px),
    var(--desk);
}
.app { max-width: 880px; padding: 18px 14px 60px; }
.footer-note { color: #9fae9f; font-family: var(--type); font-size: 12px; }

/* ---------- Registraturschild oben ---------- */
.topbar {
  background: var(--paper); border: 1px solid var(--manila-dk); border-radius: 3px;
  box-shadow: 0 6px 16px rgba(0,0,0,.35); font-family: var(--type); color: var(--ink);
  backdrop-filter: none; -webkit-backdrop-filter: none; padding: 8px 14px;
}
.topbar .title { font-weight: 700; font-size: 15px; }
.topbar .pill { background: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0; font-size: 14px; padding: 0 0 0 12px; }

/* ---------- Papier ---------- */
.sheet {
  position: relative; background: var(--paper); color: var(--ink);
  background-image:
    radial-gradient(140% 90% at 50% 40%, transparent 60%, rgba(120,90,40,.16) 100%),
    linear-gradient(var(--paper), var(--paper));
  padding: 30px 30px 26px; margin: 0 0 22px; border-radius: 2px;
  box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 14px 28px rgba(0,0,0,.35);
}
.sheet h2, .sheet h3, .sheet h4 { font-family: var(--type); font-weight: 700; letter-spacing: .01em; }
.sheet h2 { font-size: clamp(22px, 3.4vw, 28px); margin-bottom: 14px; }
.sheet h3 { font-size: 18px; margin: 18px 0 10px; }
.typed { font-family: var(--type); font-size: 16px; line-height: 1.65; }

/* ---------- Aktendeckel (Startseite) ---------- */
.desk-stage { perspective: 1600px; margin: 18px auto 10px; max-width: 640px; }
.cover {
  position: relative; background: var(--manila);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 3px),
    radial-gradient(130% 100% at 30% 20%, rgba(255,255,255,.18), transparent 60%),
    radial-gradient(160% 120% at 50% 50%, transparent 55%, rgba(80,55,20,.35) 100%);
  border-radius: 4px 10px 6px 4px; padding: 54px 40px 40px; min-height: 520px;
  box-shadow: 0 2px 0 var(--manila-dk), 0 4px 0 #8e7547, 0 26px 50px rgba(0,0,0,.55);
  transform-origin: left center; transition: transform .9s cubic-bezier(.6,.05,.3,1), opacity .9s;
}
.cover::before { /* Reiter */
  content: "1919–1933"; position: absolute; top: -30px; right: 46px; width: 150px; height: 32px;
  background: var(--manila-lt); border-radius: 8px 8px 0 0; font: 700 14px var(--type);
  display: flex; align-items: center; justify-content: center; color: var(--ink-soft);
  box-shadow: inset 0 -2px 0 var(--manila-dk);
}
.cover::after { /* Kaffeerand */
  content: ""; position: absolute; width: 130px; height: 130px; right: 30px; bottom: 34px; border-radius: 50%;
  background: radial-gradient(circle, transparent 56%, rgba(110,70,25,.22) 60%, rgba(110,70,25,.08) 66%, transparent 70%);
  pointer-events: none;
}
.cover.opening { transform: rotateY(-115deg); opacity: 0; }
.label-card {
  background: #f7f1e0; border: 1px solid #b9a77f; padding: 18px 22px; max-width: 470px;
  font-family: var(--type); font-size: 15px; line-height: 1.7; box-shadow: 0 2px 4px rgba(0,0,0,.15);
}
.label-card .row-l { display: flex; gap: 10px; border-bottom: 1px solid var(--rule); padding: 3px 0; }
.label-card .row-l span:first-child { min-width: 110px; color: var(--ink-soft); }
.cover h1 { font-family: var(--serif); font-size: clamp(40px, 8vw, 64px); line-height: 1; margin: 30px 0 6px; letter-spacing: -.01em; color: #2b2418; }
.cover .sub { font-family: var(--type); font-size: 17px; color: #3b3020; margin-bottom: 26px; }
.stamp {
  display: inline-block; font: 700 18px var(--type); letter-spacing: .18em; color: var(--stamp);
  border: 3px double var(--stamp); padding: 6px 14px 4px; border-radius: 4px; opacity: .85;
  transform: rotate(-7deg); mix-blend-mode: multiply;
  -webkit-mask-image: repeating-linear-gradient(115deg, #000 0 7px, rgba(0,0,0,.72) 7px 9px);
  mask-image: repeating-linear-gradient(115deg, #000 0 7px, rgba(0,0,0,.72) 7px 9px);
}
.stamp.red { color: var(--red); border-color: var(--red); }
.cover .stamp { position: absolute; right: 38px; top: 70px; }
.string-btn {
  appearance: none; cursor: pointer; font: 700 17px var(--type); color: #2b2418;
  background: #efe4c8; border: 2px solid #6f5a33; border-radius: 30px; padding: 12px 26px; min-height: 50px;
  box-shadow: 0 3px 0 #6f5a33;
}
.string-btn:hover { background: #f6edd6; }
.string-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6f5a33; }

/* ---------- Handschriftliche Notiz mit Büroklammer ---------- */
.note {
  position: relative; background: #fbf6e7; font-family: var(--hand); font-size: 19px; line-height: 1.45; color: #233a6b;
  padding: 18px 20px 14px; margin: 18px 0; max-width: 560px; transform: rotate(-1.2deg);
  box-shadow: 0 6px 14px rgba(0,0,0,.22); border-top: 1px solid #e8dfc6;
  background-image: repeating-linear-gradient(transparent 0 26px, rgba(35,58,107,.12) 26px 27px);
}
.note::before { /* Büroklammer */
  content: ""; position: absolute; top: -14px; left: 26px; width: 16px; height: 44px;
  border: 3px solid #8d949c; border-radius: 10px; border-bottom-color: transparent; transform: rotate(8deg);
}
.note .sig { display: block; text-align: right; margin-top: 4px; }
.note b { font-weight: 700; }

/* ---------- Geöffnete Akte (Ordner mit Reiter und Heftstreifen) ---------- */
.folder {
  position: relative; background: var(--manila); padding: 26px 18px 18px 44px; margin-top: 34px;
  border-radius: 3px 8px 6px 6px; box-shadow: 0 22px 44px rgba(0,0,0,.5);
  background-image: radial-gradient(160% 120% at 50% 50%, transparent 55%, rgba(80,55,20,.3) 100%);
}
.folder .tab {
  position: absolute; top: -28px; left: 60px; background: var(--manila); padding: 6px 18px 4px;
  border-radius: 8px 8px 0 0; font: 700 14px var(--type); color: #3b3020;
}
.folder::before { /* Heftstreifen */
  content: ""; position: absolute; left: 14px; top: 30px; bottom: 30px; width: 12px;
  background: repeating-linear-gradient(#cfd3d6 0 3px, #9aa1a8 3px 5px); border-radius: 3px; opacity: .9;
}
.folder .sheet { margin-left: 0; }
.folder .sheet + .sheet { transform: rotate(.25deg); }

/* ---------- Dokumente in der Station ---------- */
.doc { background: #fbf7ea; border: 1px solid var(--rule); padding: 18px 20px; margin: 14px 0 18px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
.doc h4 { font-family: var(--type); font-size: 16px; margin: 0 0 10px; text-decoration: underline; text-underline-offset: 4px; }
.doc ul { margin: 0; padding-left: 20px; }
.doc li { margin-bottom: 5px; }
.doc p { margin-bottom: 10px; }
.doc .quote { font-family: var(--type); font-size: 15.5px; line-height: 1.6; border-left: 3px solid var(--ink); padding-left: 14px; margin: 8px 0; }
.doc .src { font-family: var(--type); font-size: 12.5px; color: var(--ink-soft); border-top: 1px dashed var(--rule); padding-top: 6px; margin-top: 10px; }
.doc.clip { /* Zeitungsausschnitt */
  background: #e9e3d2; font-family: Georgia, "Times New Roman", serif; columns: 2 220px; column-gap: 22px; column-rule: 1px solid #bdb39b;
  transform: rotate(-.8deg); border: 0; box-shadow: 0 4px 10px rgba(0,0,0,.18);
  clip-path: polygon(0 2%, 4% 0, 12% 2%, 22% 0, 35% 1.5%, 48% 0, 60% 2%, 72% 0, 85% 1.5%, 100% 0, 99% 30%, 100% 60%, 98.5% 100%, 85% 98.5%, 70% 100%, 55% 98%, 40% 100%, 25% 98.5%, 10% 100%, 0 98%, 1% 60%);
}
.doc.clip h4 { column-span: all; font-family: Georgia, serif; font-size: 20px; text-decoration: none; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
table.prices { border-collapse: collapse; width: 100%; font-family: var(--type); font-size: 15px; }
table.prices th, table.prices td { border-bottom: 1px solid var(--rule); padding: 7px 6px; text-align: left; }
table.prices th { font-weight: 700; border-bottom: 2px solid var(--ink); }
.chart { width: 100%; max-width: 560px; height: auto; display: block; margin: 4px 0; }

/* ---------- Inhaltsverzeichnis ---------- */
.toc { list-style: none; margin: 8px 0 0; padding: 0; font-family: var(--type); }
.toc li { border-bottom: 1px solid var(--rule); }
.toc button {
  appearance: none; width: 100%; background: none; border: 0; cursor: pointer; text-align: left; color: var(--ink);
  font: 16px var(--type); padding: 14px 4px; display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center;
}
.toc button:hover:not([disabled]) { background: rgba(77,58,138,.06); }
.toc button[disabled] { color: #9a917c; cursor: not-allowed; }
.toc .blatt { color: var(--ink-soft); }
.toc .titel { overflow-wrap: anywhere; }
.toc .titel small { display: block; color: var(--ink-soft); font-size: 13px; }
.toc .status { font-size: 13px; }
.toc .status.go { color: var(--paper); background: var(--stamp); padding: 5px 10px; border-radius: 3px; }
.toc .status.done { font: 700 12px var(--type); letter-spacing: .12em; color: var(--stamp); border: 2px solid var(--stamp); padding: 2px 6px; transform: rotate(-6deg); display: inline-block; opacity: .85; }
.toc li.current { background: rgba(77,58,138,.05); }

/* ---------- Karteikasten ---------- */
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 10px; }
.cause {
  position: relative; background: #fffdf6; padding: 30px 16px 14px; min-height: 140px; font-size: 15px; line-height: 1.45;

<script>
/* fb-education Lern-Apps – Core
   - SCORM 1.2 (findet die LMS-API automatisch, läuft ohne LMS einfach lokal)
   - Fortschritt speichern (SCORM suspend_data oder localStorage)
   - Gestuftes Feedback für Eingaben (Apostroph/Großschreibung, Tippfehler, Grammatik)
   - Kleine UI-Helfer
   Keine externen Verbindungen, keine personenbezogenen Daten. */
(function () {
  "use strict";
  var LA = {};

  /* ---------- DOM-Helfer ---------- */
  LA.$ = function (sel, root) { return (root || document).querySelector(sel); };
  LA.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  LA.h = function (tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  };
  LA.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };

  var toastTimer;
  LA.toast = function (msg, ms) {
    var t = LA.$("#la-toast");
    if (!t) { t = LA.h("div", { id: "la-toast", class: "toast", role: "status", "aria-live": "polite" }); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, ms || 2600);
  };

  /* ---------- SCORM 1.2 ---------- */
  var scorm = { api: null, active: false, start: Date.now() };
  function findAPI(win) {
    var tries = 0;
    while (win && tries < 12) {
      try { if (win.API) return win.API; } catch (e) { return null; }
      if (win.parent && win.parent !== win) { win = win.parent; tries++; } else break;
    }
    return null;
  }
  scorm.init = function () {
    var api = findAPI(window);
    if (!api) { try { if (window.opener) api = findAPI(window.opener); } catch (e) { api = null; } }
    if (!api) return false;
    try {
      if (String(api.LMSInitialize("")) === "true") {
        scorm.api = api; scorm.active = true;
        var st = scorm.get("cmi.core.lesson_status");
        if (!st || st === "not attempted") scorm.set("cmi.core.lesson_status", "incomplete");
        scorm.commit();
      }
    } catch (e) { scorm.active = false; }
    return scorm.active;
  };
  scorm.get = function (k) { if (!scorm.active) return ""; try { return String(scorm.api.LMSGetValue(k) || ""); } catch (e) { return ""; } };
  scorm.set = function (k, v) { if (!scorm.active) return false; try { return String(scorm.api.LMSSetValue(k, String(v))) === "true"; } catch (e) { return false; } };
  scorm.commit = function () { if (!scorm.active) return; try { scorm.api.LMSCommit(""); } catch (e) {} };
  function sessionTime() {
    var s = Math.max(0, Math.round((Date.now() - scorm.start) / 1000));
    var hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    function p(n, l) { n = String(n); while (n.length < l) n = "0" + n; return n; }
    return p(hh, 4) + ":" + p(mm, 2) + ":" + p(ss, 2);
  }
  scorm.finish = function () {
    if (!scorm.active || scorm.finished) return;
    scorm.finished = true;
    scorm.set("cmi.core.session_time", sessionTime());
    scorm.set("cmi.core.exit", scorm.exitMode === undefined ? "suspend" : scorm.exitMode);
    scorm.commit();
    try { scorm.api.LMSFinish(""); } catch (e) {}
  };
  LA.scorm = scorm;

  /* Ergebnis an das LMS melden (Prozent 0–100) */
  LA.report = function (percent, finished, passMark) {
    var pct = Math.max(0, Math.min(100, Math.round(percent)));
    if (!scorm.active) return;
    scorm.set("cmi.core.score.min", 0);
    scorm.set("cmi.core.score.max", 100);
    scorm.set("cmi.core.score.raw", pct);
    if (finished) scorm.set("cmi.core.lesson_status", pct >= (passMark || 50) ? "passed" : "completed");
    scorm.commit();
  };

  /* ---------- Speichern ---------- */
  LA.store = {
    load: function (appId) {
      var raw = "";
      if (scorm.active) raw = scorm.get("cmi.suspend_data");
      if (!raw) { try { raw = window.localStorage.getItem("la:" + appId) || ""; } catch (e) { raw = ""; } }
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    },
    save: function (appId, data) {
      var raw = JSON.stringify(data);
      if (scorm.active) { scorm.set("cmi.suspend_data", raw.slice(0, 4000)); scorm.commit(); }
      try { window.localStorage.setItem("la:" + appId, raw); } catch (e) {}
    },
    clear: function (appId) {
      if (scorm.active) { scorm.set("cmi.suspend_data", ""); scorm.commit(); }
      try { window.localStorage.removeItem("la:" + appId); } catch (e) {}
    }
  };

  /* ---------- Antwortprüfung mit gestuftem Feedback ---------- */
  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) { d[i] = [i]; }
    for (j = 0; j <= n; j++) { d[0][j] = j; }
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    return d[m][n];
  }
  LA.lev = lev;
  function norm(s) {
    return String(s || "").replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?]+$/, "");
  }
  function bare(s) { return norm(s).toLowerCase().replace(/'/g, "").replace(/\s+/g, ""); }

  /* item: { answers:[...], wrongForms:{ "form": "hint" }, hint:"allgemeiner Tipp" }
     Rückgabe: { ok:true } oder { ok:false, type, msg } */
  LA.checkText = function (input, item) {
    var given = norm(input);
    if (!given) return { ok: false, type: "empty", msg: "✏️ Type your answer first." };
    var answers = item.answers;
    for (var i = 0; i < answers.length; i++) if (given === norm(answers[i])) return { ok: true };
    for (i = 0; i < answers.length; i++) if (given.toLowerCase() === norm(answers[i]).toLowerCase()) return { ok: true };
    // Apostroph / Leerzeichen
    for (i = 0; i < answers.length; i++) if (bare(given) === bare(answers[i])) {
      return { ok: false, type: "apostrophe", msg: "🔎 So close! Check the apostrophe (') or the spaces." };
    }
    // Typische Grammatikfehler (bekannte falsche Formen)
    var wf = item.wrongForms || {};
    var gl = given.toLowerCase();
    for (var key in wf) if (Object.prototype.hasOwnProperty.call(wf, key) && bare(key) === bare(gl)) {
      return { ok: false, type: "grammar", msg: "🧠 " + wf[key] };
    }
    // Tippfehler
    for (i = 0; i < answers.length; i++) {
      var a = norm(answers[i]).toLowerCase();
      var dist = lev(gl, a);
      if (dist > 0 && dist <= (a.length > 6 ? 2 : 1)) return { ok: false, type: "spelling", msg: "🔤 Almost! Check your spelling." };
    }
    return { ok: false, type: "grammar", msg: "🧠 " + (item.hint || "Not yet. Read the sentence again and try once more.") };
  };

  window.LA = LA;
  window.addEventListener("pagehide", function () { scorm.finish(); });
  window.addEventListener("beforeunload", function () { scorm.finish(); });
})();

</script>

      '<li>Der Reichskanzler hat keine Mehrheit. Der Reichstag lehnt sein Gesetz ab.</li>' +

/* =========================================================

var state;
function freshState() { return { v: 1, stage: "intro", done: [], pts: {}, hints: {}, elapsed: 0, finished: false, report: null }; }
var sessionStart = Date.now();
function maxScore() { var n = 0; STATIONS.forEach(function (s) { n += s.tasks.length; }); return n * 10; }
function score() { var s = 0, k; for (k in state.pts) s += state.pts[k]; for (k in state.hints) if (state.hints[k]) s -= 5; return Math.max(0, s); }
function percent() { return Math.round(score() / maxScore() * 100); }
function save() {
  state.elapsed += Date.now() - sessionStart; sessionStart = Date.now();
  var copy = JSON.parse(JSON.stringify(state));
  if (copy.report && copy.report.text) copy.report.text = copy.report.text.slice(0, 1200);
  LA.store.save(APP_ID, copy); LA.report(percent(), false);
}
function setPts(key, wrong, opts) {
  opts = opts || {};
  var p = opts.revealed ? 0 : opts.binary ? (wrong === 0 ? 10 : 2) : ([10, 6, 3][wrong] !== undefined ? [10, 6, 3][wrong] : 1);
  state.pts[key] = p; updateBar(); return p;
}
function updateBar(where) { $("#points").textContent = score(); if (where) $("#where").textContent = where; }

}
function note(html, sig) { return h("div", { class: "note" }, [h("div", { html: html }), h("span", { class: "sig", text: sig || "– Dr. Roth, Archivleitung" })]); }
function feedback(el, kind, html) { el.className = "feedback show " + kind; el.innerHTML = html; }
function shake(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function today() { var d = new Date(); return d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear(); }

/* ---------- Inhaltsverzeichnis ---------- */

    return h("li", { class: isOpen ? "current" : "" }, [h("button", { type: "button", disabled: !isDone && !isOpen ? true : null,
      onclick: function () { if (isOpen) screenStation(i); else if (isDone) LA.toast("Blatt " + (i + 1) + " ist bereits abgeheftet."); } }, [
      h("span", { class: "blatt", text: "Blatt " + (i + 1) }),

    h("section", { class: "folder" }, [
      h("span", { class: "tab", text: "Akte W 1919/33" }),
      h("div", { class: "sheet" }, [

}
function causeCards() {
  return h("div", { class: "cards" }, STATIONS.map(function (s) {
    return state.done.indexOf(s.id) > -1 ? h("div", { class: "cause" }, [h("b", { text: s.card.title }), s.card.text]) : h("div", { class: "cause empty", "aria-hidden": "true", text: "." });
  }));
}

/* ---------- Blatt (Station) ---------- */
function screenStation(idx) {
  var st = STATIONS[idx];
  state.stage = "station";
  Object.keys(state.pts).forEach(function (k) { if (k.indexOf(st.id + "-") === 0) delete state.pts[k]; });
  save(); updateBar("Blatt " + (idx + 1) + " von " + STATIONS.length);
  var total = st.tasks.length, solved = 0;
  var exitBtn = h("button", { class: "btn primary", type: "button", disabled: true, onclick: function () { finishStation(idx); } }, ["Blatt abheften"]);
  function onSolved() { solved++; if (solved >= total) { exitBtn.disabled = false; LA.toast("Prüfbogen vollständig. Du kannst das Blatt jetzt abheften."); } save(); }
  var tipBox = h("div");
  var tipBtn = h("button", { class: "btn ghost", type: "button", onclick: function () {
    if (!state.hints[st.id]) { state.hints[st.id] = true; updateBar(); save(); }
    tipBox.innerHTML = ""; tipBox.appendChild(note(st.tip)); tipBtn.textContent = "Rat erhalten (−5 Punkte)"; tipBtn.disabled = true;
  } }, [state.hints[st.id] ? "Rat erhalten (−5 Punkte)" : "Dr. Roth um Rat fragen (−5 Punkte)"]);
  var form = h("div", { class: "sheet form" }, [h("h2", { text: "Prüfbogen zu Blatt " + (idx + 1) })]);
  st.tasks.forEach(function (t, ti) { form.appendChild(RENDER[t.type](t, st.id + "-" + ti, onSolved, ti)); });
  show([
    h("section", { class: "folder" }, [
      h("span", { class: "tab", text: "Blatt " + (idx + 1) + " – " + st.year }),
      h("div", { class: "sheet" }, [
        h("h2", { text: st.name }),
        h("p", { class: "typed", text: st.intro }),
        h("div", { html: typeof st.doc === "function" ? st.doc() : st.doc }),

        tipBox

      form,
      h("div", { class: "row exit-row" }, [exitBtn])

}
function finishStation(idx) {

    h("h2", { id: "modalTitle", text: "Blatt " + (idx + 1) + " abgeheftet" }),

    h("p", { class: "typed", text: "Neue Karteikarte für deinen Karteikasten:" }),
    h("div", { class: "cards" }, [h("div", { class: "cause" }, [h("b", { text: st.card.title }), st.card.text])]),
    h("div", { class: "row end", style: "margin-top:18px" }, [h("button", { class: "btn primary", type: "button", onclick: function () { closeModal(); screenMap(); } }, ["Zum Inhaltsverzeichnis"])])
  ])]);
}

   ========================================================= */
var RENDER = {};
function qHead(t, i) {
  return h("div", { class: "q", html: "<span class='num'>" + (i + 1) + ".</span> " + t.q + (t.hard ? " <span class='hard-mark'>knifflig!</span>" : "") });
}
RENDER.mc = function (t, key, done, i) {
  var wrong = 0, box = h("div", { class: "task" });
  var fb = h("div", { class: "feedback", role: "status" }), opts = h("div", { class: "opts" });
  t.options.forEach(function (o, oi) {
    var b = h("button", { class: "opt", type: "button", onclick: function () {
      if (box.classList.contains("done")) return;
      if (oi === t.answer) {
        b.classList.add("right"); LA.$$(".opt", opts).forEach(function (x) { x.disabled = true; });
        box.classList.add("done");
        var p = setPts(key, wrong, { binary: t.binary });
        feedback(fb, "ok", "Richtig. +" + p + " Punkte"); done();
      } else {
        wrong++; b.classList.add("wrong"); b.disabled = true;
        feedback(fb, "tip", (t.hints && t.hints[oi]) || "Noch nicht. Lies die Quelle noch einmal.");
      }
    } }, [o]);
    opts.appendChild(b);
  });
  box.appendChild(qHead(t, i));
  box.appendChild(opts); box.appendChild(fb);
  return box;
};
function makeChip(label, zone) {
  var c = h("button", { class: "chip", type: "button" }, [label]);
  c.addEventListener("click", function () {
    if (zone.classList.contains("right")) return;
    if (c.parentNode === zone) c._home.appendChild(c); else { c._home = c.parentNode; zone.appendChild(c); }
    zone.classList.remove("wrong");
  });
  return c;
}
function resetZone(zone, chips) { LA.$$(".chip", zone).forEach(function (c) { (c._home || chips).appendChild(c); }); zone.classList.remove("wrong", "right"); }
RENDER.sequence = function (t, key, done, i) {
  var wrong = 0, box = h("div", { class: "task" }), fb = h("div", { class: "feedback", role: "status" });
  var zone = h("div", { class: "answer-zone", "data-placeholder": "Tippe die Ereignisse an: zuerst … dann …" });
  zone.style.flexDirection = "column"; zone.style.alignItems = "stretch";
  var chips = h("div", { class: "chips" }); chips.style.flexDirection = "column";
  var sh = LA.shuffle(t.items); if (sh.join("|") === t.items.join("|")) sh = sh.slice(1).concat(sh[0]);
  sh.forEach(function (w) { chips.appendChild(makeChip(w, zone)); });
  var reveal = h("button", { class: "btn ghost", type: "button", hidden: true, onclick: function () {
    resetZone(zone, chips);
    t.items.forEach(function (w) { var c = LA.$$(".chip", chips).filter(function (x) { return x.textContent === w; })[0]; if (c) { c._home = chips; zone.appendChild(c); } });
    finish(true);
  } }, ["Lösung zeigen"]);
  function finish(revealed) {
    zone.classList.add("right"); box.classList.add("done"); check.disabled = true; reset.disabled = true; reveal.hidden = true; chips.hidden = true;
    var p = setPts(key, wrong, { revealed: revealed });
    feedback(fb, "ok", revealed ? "So ist die richtige Reihenfolge. Lies sie dir noch einmal durch." : "Richtig. +" + p + " Punkte"); done();
  }
  var check = h("button", { class: "btn", type: "button", onclick: function () {
    var got = LA.$$(".chip", zone).map(function (c) { return c.textContent; });
    if (got.length < t.items.length) { feedback(fb, "tip", "Ordne alle Ereignisse ein."); return; }
    if (got.join("|") === t.items.join("|")) { finish(false); return; }
    var fw = 0; while (got[fw] === t.items[fw]) fw++;
    wrong++; shake(zone, "wrong");
    feedback(fb, "bad", (fw === 0 ? "Noch nicht. Schon das erste Ereignis stimmt nicht. " : "Noch nicht. Die ersten " + fw + " Ereignisse stimmen. ") + t.hint);
    if (wrong >= 3) reveal.hidden = false;
  } }, ["Prüfen"]);
  var reset = h("button", { class: "btn ghost", type: "button", onclick: function () { resetZone(zone, chips); fb.classList.remove("show"); } }, ["Zurücksetzen"]);
  box.appendChild(qHead(t, i));
  box.appendChild(zone); box.appendChild(chips);
  box.appendChild(h("div", { class: "row", style: "margin-top:10px" }, [check, reset, reveal])); box.appendChild(fb);
  return box;
};

RENDER.multi = function (t, key, done, i) {
  var wrong = 0, lastSig = "", box = h("div", { class: "task multi" }), fb = h("div", { class: "feedback", role: "status" });
  var opts = h("div", { class: "opts" }), btns = [];
  t.options.forEach(function (o, oi) {
    var b = h("button", { class: "opt", type: "button", "aria-pressed": "false", onclick: function () {
      if (box.classList.contains("done")) return;
      b.classList.toggle("sel"); b.setAttribute("aria-pressed", b.classList.contains("sel") ? "true" : "false");
      LA.$$(".opt", opts).forEach(function (x) { x.classList.remove("wrong", "missed"); });
    } }, [o]);
    btns.push(b); opts.appendChild(b);
  });
  function finish(revealed) {
    btns.forEach(function (b, bi) {
      var isAns = t.answers.indexOf(bi) > -1;
      b.classList.toggle("sel", isAns); b.classList.toggle("right", isAns); b.classList.remove("wrong", "missed"); b.disabled = true;
    });
    box.classList.add("done"); check.disabled = true; reveal.hidden = true;
    var p = setPts(key, wrong, { revealed: revealed });
    feedback(fb, "ok", revealed ? "Hier sind die richtigen Kreuze. Lies die Aussagen noch einmal." : "Alles richtig angekreuzt. +" + p + " Punkte"); done();
  }
  var check = h("button", { class: "btn", type: "button", onclick: function () {
    var sel = btns.map(function (b, bi) { return b.classList.contains("sel") ? bi : -1; }).filter(function (x) { return x > -1; });
    if (!sel.length) { feedback(fb, "tip", "Kreuze mindestens eine Aussage an."); return; }
    var hits = sel.filter(function (x) { return t.answers.indexOf(x) > -1; }).length;
    var falsePos = sel.length - hits;
    if (hits === t.answers.length && falsePos === 0) { finish(false); return; }
    var sig = sel.join(",");
    if (sig !== lastSig) wrong++;
    lastSig = sig;
    var msg = "Noch nicht. ";
    if (falsePos) msg += falsePos === 1 ? "Ein Kreuz ist falsch. " : falsePos + " Kreuze sind falsch. ";
    if (hits < t.answers.length) msg += t.answers.length - hits === 1 ? "Es fehlt noch eine richtige Aussage. " : "Es fehlen noch " + (t.answers.length - hits) + " richtige Aussagen. ";
    if (wrong >= 2) {
      btns.forEach(function (b, bi) { if (b.classList.contains("sel") && t.answers.indexOf(bi) === -1) b.classList.add("wrong"); });
      msg += "Die falschen Kreuze sind jetzt markiert. ";
    }
    feedback(fb, "bad", msg + t.hint);
    if (wrong >= 3) reveal.hidden = false;
  } }, ["Prüfen"]);
  var reveal = h("button", { class: "btn ghost", type: "button", hidden: true, onclick: function () { finish(true); } }, ["Lösung zeigen"]);
  box.appendChild(qHead(t, i)); box.appendChild(opts);
  box.appendChild(h("div", { class: "row", style: "margin-top:8px" }, [check, reveal])); box.appendChild(fb);
  return box;
};

RENDER.assign = function (t, key, done, i) {
  var wrong = 0, lastSig = "", box = h("div", { class: "task" }), fb = h("div", { class: "feedback", role: "status" });
  var picks = t.rows.map(function () { return -1; }), rows = [];
  var list = h("div", {});
  t.rows.forEach(function (r, ri) {
    var btns = t.people.map(function (name, pi) {
      var b = h("button", { class: "who-btn", type: "button", "aria-pressed": "false", onclick: function () {
        if (box.classList.contains("done")) return;
        picks[ri] = pi; row.classList.remove("wrong");
        btns.forEach(function (x, xi) { x.classList.toggle("sel", xi === pi); x.setAttribute("aria-pressed", xi === pi ? "true" : "false"); });
      } }, [name]);
      return b;
    });
    var row = h("div", { class: "assign-row" }, [h("span", { text: r[0] }), h("span", { class: "who-btns" }, btns)]);
    rows.push({ el: row, btns: btns }); list.appendChild(row);
  });
  function finish(revealed) {
    t.rows.forEach(function (r, ri) {
      picks[ri] = r[1];
      rows[ri].btns.forEach(function (x, xi) { x.classList.toggle("sel", xi === r[1]); x.disabled = true; });
      rows[ri].el.classList.remove("wrong"); rows[ri].el.classList.add("right");
    });
    box.classList.add("done"); check.disabled = true; reveal.hidden = true;
    var p = setPts(key, wrong, { revealed: revealed });
    feedback(fb, "ok", revealed ? "Hier ist die richtige Zuordnung. Lies die Personalakten noch einmal." : "Alles richtig zugeordnet. +" + p + " Punkte"); done();
  }
  var check = h("button", { class: "btn", type: "button", onclick: function () {
    if (picks.indexOf(-1) > -1) { feedback(fb, "tip", "Ordne jede Aussage einem Kanzler zu."); return; }
    var ok = t.rows.filter(function (r, ri) { return picks[ri] === r[1]; }).length;
    if (ok === t.rows.length) { finish(false); return; }
    var sig = picks.join(","); if (sig !== lastSig) wrong++; lastSig = sig;
    var msg = "Noch nicht. " + ok + " von " + t.rows.length + " Zuordnungen stimmen. ";
    if (wrong >= 2) {
      t.rows.forEach(function (r, ri) { rows[ri].el.classList.toggle("wrong", picks[ri] !== r[1]); });
      msg += "Die falschen sind jetzt rot markiert. ";
    }
    feedback(fb, "bad", msg + t.hint);
    if (wrong >= 3) reveal.hidden = false;
  } }, ["Prüfen"]);
  var reveal = h("button", { class: "btn ghost", type: "button", hidden: true, onclick: function () { finish(true); } }, ["Lösung zeigen"]);
  box.appendChild(qHead(t, i)); box.appendChild(list);
  box.appendChild(h("div", { class: "row", style: "margin-top:10px" }, [check, reveal])); box.appendChild(fb);
  return box;
};

/* ---------- Modal ---------- */
function modal(nodes) { var tt = $("#la-toast"); if (tt) tt.classList.remove("show"); var b = $("#modalBox"); b.innerHTML = ""; nodes.forEach(function (n) { b.appendChild(n); }); $("#modal").classList.add("show"); var x = b.querySelector("button"); if (x) x.focus(); }
function closeModal() { $("#modal").classList.remove("show"); }

/* ---------- Start ---------- */
LA.scorm.init();
state = freshState();
var saved = LA.store.load(APP_ID);
if (saved && saved.finished) saved = null;
screenIntro(saved);
})();
</script>
